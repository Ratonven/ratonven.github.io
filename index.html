<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ratonven Hub Test API</title>
</head>
<body style="background:#080b12;color:white;font-family:Arial;padding:30px;">

  <h1>Ratonven Hub API Test</h1>
  <p>Data dari Google Sheet akan tampil di bawah ini:</p>

  <pre id="output">Loading...</pre>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbymQPVQY2c2J6GYvQgkUPpOAyfor6oUb0Icgo5km-vaciBgjOlFAMxRfsfSuCQ_-NjLPw/exec";

    fetch(API_URL)
      .then(response => response.json())
      .then(result => {
        document.getElementById("output").textContent =
          JSON.stringify(result, null, 2);
      })
      .catch(error => {
        document.getElementById("output").textContent =
          "Gagal mengambil data: " + error.message;
      });
  </script>

</body>
</html>
